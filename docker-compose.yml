services:
  mysql:
    image: mysql:8.0
    container_name: food-rescue-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: food_rescue
      MYSQL_USER: foodapp
      MYSQL_PASSWORD: foodapp123
      TZ: America/New_York   # so times in MySQL Workbench match the app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  mysql_data:
